name: LTE tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build host test program
        run: |
          gcc -Wall -Wextra -g \
            -Icomponents/hardware/include \
            -Icomponents/lte_driver/include \
            -Icomponents/lte_types/include \
            -Icomponents/comms/include \
            -Icomponents/state_machine/include \
            -Itests/include \
            components/state_machine/lte_sm.c \
            components/lte_driver/lte_driver.c \
            components/comms/lte_mqtt.c \
            components/comms/lte_tcp.c \
            components/hardware/lte_hw_test.c \
            tests/lte_test_harness.c \
            tests/host_main.c \
            -o lte_tests

      - name: Run tests
        run: |
          set -o pipefail
          stdbuf -oL timeout 30 ./lte_tests | tee test_output.txt

      - name: Test report
        if: always()
        run: |
          {
            echo "## LTE state machine tests"
            echo
            if [ -f test_output.txt ]; then
              echo "| Test | Result |"
              echo "|---|---|"
              awk '
                /^TEST: /  { name = substr($0, 7) }
                /^PASS/    { printf "| %s | ✅ Pass |\n", name }
                /^FAIL/    { printf "| %s | ❌ Fail |\n", name }
              ' test_output.txt
              echo
              grep "TEST SUMMARY" test_output.txt || echo "No summary line found (the program may have stopped early)."
            else
              echo "No test output: the build or the test run did not start."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lte-test-log
          path: test_output.txt
          if-no-files-found: ignore